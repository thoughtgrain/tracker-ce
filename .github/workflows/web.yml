name: Website

# Builds the site in web/ and deploys it to GitHub Pages. The site lives on this branch
# (work/website) so main stays firmware only. The docs pages are built from main's docs/,
# CHANGELOG.md and README.md, pulled in at build time, so they're always current.
# - push to work/website: deploy site changes.
# - workflow_dispatch: redeploy on demand, for example after a new release or a docs change on
#   main. Events on main (releases, firmware builds) can't start a workflow that only exists on
#   this branch, so those redeploys are started by hand or from a workflow on main.
on:
  push:
    branches: [ work/website ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # The docs belong to the firmware, so take main's copy rather than this branch's.
      - name: Use main's docs
        working-directory: .
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- docs CHANGELOG.md README.md

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
